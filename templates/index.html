<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuya Smart Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="dashboard-container">
        <header>
            <h1><i class="fa-solid fa-house-signal"></i> Tuya Dashboard</h1>
            <p>Control Center for Local Devices</p>
        </header>

        <main class="grid-container">
            
            <!-- PIR Sensor Widget -->
            <div class="card glass">
                <div class="card-header">
                    <h2><i class="fa-solid fa-person-rays"></i> Motion Sensor</h2>
                    <span id="pir-status-badge" class="badge active">--</span>
                </div>
                <div class="card-body center-content">
                    <div class="icon-container" id="pir-icon-container">
                        <i id="pir-icon" class="fa-solid fa-eye-slash"></i>
                    </div>
                    <h3 id="pir-text">No Motion Detected</h3>
                    <p id="pir-battery" class="battery-label"><i class="fa-solid fa-battery-full"></i> Battery: --</p>
                </div>
            </div>

            <!-- Switch Robot Widget -->
            <div class="card glass">
                <div class="card-header">
                    <h2><i class="fa-solid fa-robot"></i> Switch Robot</h2>
                    <span id="switch-status-badge" class="badge active">--</span>
                </div>
                <div class="card-body center-content">
                    <label class="switch-toggle">
                        <input type="checkbox" id="switch-checkbox">
                        <span class="slider round"></span>
                    </label>
                    <h3 id="switch-text">Switch is OFF</h3>
                </div>
            </div>

            <!-- IR Blaster Widget -->
            <div class="card glass">
                <div class="card-header">
                    <h2><i class="fa-solid fa-tower-broadcast"></i> Smart IR Blaster</h2>
                    <span id="ir-status-badge" class="badge active">Cloud</span>
                </div>
                <div class="card-body">
                    <p class="desc">Send custom Base64 IR commands via Tuya Cloud.</p>
                    <div class="input-group">
                        <input type="text" id="ir-code-input" placeholder="Paste Base64 IR Code here...">
                        <button id="send-ir-btn" class="btn-primary">
                            <i class="fa-solid fa-paper-plane"></i> Send
                        </button>
                    </div>
                    <div id="ir-feedback" class="feedback-msg"></div>
                    <p id="ir-auto-status" class="desc"></p>
                </div>
            </div>

        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

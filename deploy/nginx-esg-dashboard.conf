# /etc/nginx/sites-available/esg-dashboard  (symlink into sites-enabled)
# Check the certificate paths match what certbot created, then:
#   sudo nginx -t && sudo systemctl reload nginx

# Plain HTTP only redirects; it never reaches the app.
server {
    listen 80;
    listen [::]:80;
    server_name esg-dashboard.hafizitech.cloud;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (prod) syntax; on 1.25.1+ use "listen 443 ssl;" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esg-dashboard.hafizitech.cloud;

    ssl_certificate     /etc/letsencrypt/live/esg-dashboard.hafizitech.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esg-dashboard.hafizitech.cloud/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so they can be cached for good.
    location /assets/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location /api/stream {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
